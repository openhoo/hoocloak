name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOOVERSION_VERSION: 1.0.7
  KIND_VERSION: 0.32.0

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@d536bb45b5c2dbf9a17c866c0fe48f54216a1673 # v1.0.7
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  test:
    name: Go tests
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -tags no_otel ./...

      - name: Run benchmarks
        run: go test -tags no_otel -run '^$' -bench . -benchmem -benchtime=100ms -count=1 ./internal/config ./internal/idp

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet -tags no_otel ./...

      - name: Verify modules
        run: go mod verify

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags no_otel ./...

      - name: Scan Go security patterns
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -tags no_otel ./...

  helm:
    name: Helm chart
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Validate chart
        run: |
          set -euo pipefail
          helm lint charts/hoocloak --strict
          helm template hoocloak charts/hoocloak --namespace hoocloak > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set existingConfigSecret=hoocloak-config \
            --set existingConfigSecretKey=provider.yaml \
            --set-string existingConfigSecretVersion=1 > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=registry.example.test/hoocloak-theme@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=REGISTRY.EXAMPLE.TEST/hoocloak-theme@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=[2001:db8::1]:5000/hoocloak-theme@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=registry.example.test/hoocloak-theme:stable@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set image.repository=registry.example.test/custom-hoocloak \
            --set image.tag=1.0.8 \
            --set hoocloakConfig.ui.theme_dir=/etc/hoocloak/theme > /dev/null
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set theme.image.reference=registry.example.test/hoocloak-theme:latest > /dev/null 2>&1; then
            echo "mutable theme image reference was accepted" >&2
            exit 1
          fi
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=registry.example.test/theme@@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null 2>&1; then
            echo "malformed theme image reference was accepted" >&2
            exit 1
          fi
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=https://registry.example.test/theme@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > /dev/null 2>&1; then
            echo "scheme-prefixed theme image reference was accepted" >&2
            exit 1
          fi
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string 'theme.image.reference=registry.example.test/theme@sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > /dev/null 2>&1; then
            echo "uppercase theme digest was accepted" >&2
            exit 1
          fi
          for ambiguous in true null 123; do
            if helm template hoocloak charts/hoocloak --namespace hoocloak \
              --set "theme.image.reference=$ambiguous" > /dev/null 2>&1; then
              echo "YAML-ambiguous theme image reference $ambiguous was accepted" >&2
              exit 1
            fi
          done
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set theme.existingClaim=legacy-theme > /dev/null 2>&1; then
            echo "removed PVC theme value was accepted" >&2
            exit 1
          fi
          helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > /dev/null
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set-string image.digest=sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA > /dev/null 2>&1; then
            echo "uppercase image digest was accepted" >&2
            exit 1
          fi
          if helm template hoocloak charts/hoocloak --namespace hoocloak \
            --set 'ingress.hosts[0].host=192.0.2.10' > /dev/null 2>&1; then
            echo "IP-literal ingress host was accepted" >&2
            exit 1
          fi
          helm package charts/hoocloak --destination "$RUNNER_TEMP"
      - name: Smoke theme image on Kubernetes
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@v${KIND_VERSION}"
          docker run --detach --restart=always \
            --publish 127.0.0.1:5001:5000 \
            --name kind-registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          cat > "$RUNNER_TEMP/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
                endpoint = ["http://kind-registry:5000"]
          EOF
          kind create cluster --name hoocloak-theme --config "$RUNNER_TEMP/kind.yaml"
          docker network connect kind kind-registry

          theme_dir="$RUNNER_TEMP/theme"
          mkdir -p "$theme_dir/assets"
          cat > "$theme_dir/Dockerfile" <<'EOF'
          FROM busybox:1.37.0-uclibc@sha256:39e0df8c4d65953b55c344f017e1ff2e0031a7454b3c24e6b76d402f207e315a
          COPY --chown=65532:65532 . /theme/
          USER 65532:65532
          EOF
          cat > "$theme_dir/login.html" <<'EOF'
          <!doctype html><html><head><link rel="stylesheet" href="{{.BasePath}}/assets/theme.css"></head><body>{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}<form method="post" action="{{.BasePath}}/login"><input type="hidden" name="authRequestID" value="{{.RequestID}}"><input type="hidden" name="csrf" value="{{.CSRF}}">{{if eq .Mode "select"}}<select name="identity">{{range .Identities}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select>{{else}}<input name="username" value="{{.Username}}"><input name="password" type="password">{{end}}<button>Continue</button></form></body></html>
          EOF
          cat > "$theme_dir/logged-out.html" <<'EOF'
          <!doctype html><html><head><link rel="stylesheet" href="{{.BasePath}}/assets/theme.css"></head><body>Signed out</body></html>
          EOF
          echo 'body { color: rebeccapurple; }' > "$theme_dir/assets/theme.css"
          docker build --provenance=false --tag localhost:5001/hoocloak-theme:ci "$theme_dir"
          docker push localhost:5001/hoocloak-theme:ci
          theme_ref="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/hoocloak-theme:ci)"
          test -n "$theme_ref"

          docker build \
            --build-arg "VERSION=ci-${GITHUB_SHA::12}" \
            --provenance=false \
            --tag localhost:5001/hoocloak:ci \
            .
          docker push localhost:5001/hoocloak:ci
          app_ref="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/hoocloak:ci)"
          test -n "$app_ref"
          app_repository="${app_ref%@*}"
          app_digest="${app_ref#*@}"
          case "$app_digest" in
            sha256:*) ;;
            *)
              echo "application image reference is not digest-pinned: $app_ref" >&2
              exit 1
              ;;
          esac

          helm upgrade --install hoocloak charts/hoocloak \
            --namespace hoocloak --create-namespace \
            --set-string "image.repository=$app_repository" \
            --set-string "image.digest=$app_digest" \
            --set-string "theme.image.reference=$theme_ref" \
            --wait --timeout 2m
          test "$(kubectl -n hoocloak get pod -l app.kubernetes.io/instance=hoocloak -o jsonpath='{.items[0].status.initContainerStatuses[0].state.terminated.exitCode}')" = "0"
          kubectl -n hoocloak port-forward service/hoocloak 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/realms/development/assets/theme.css | grep -q rebeccapurple; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/port-forward.log" >&2
          exit 1

      - name: Remove theme smoke cluster
        if: always()
        run: |
          kind delete cluster --name hoocloak-theme || true
          docker rm --force kind-registry || true

  docker:
    name: Container images
    needs:
      - commitlint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: hoocloak-ci-${{ github.run_id }}
      MAX_COMPRESSED_SIZE: "5242880"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Compose
        run: |
          docker compose config --quiet
          HOOCLOAK_THEME_DIR="$RUNNER_TEMP/hoocloak-theme" \
            docker compose -f compose.yaml -f compose.theme.yaml config --quiet

      - name: Build release-shaped image
        run: |
          docker buildx build \
            --build-arg "VERSION=ci-${GITHUB_SHA::12}" \
            --cache-from type=gha,scope=hoocloak-image \
            --cache-to type=gha,mode=max,scope=hoocloak-image \
            --output "type=oci,dest=$RUNNER_TEMP/hoocloak.oci.tar,compression=zstd,compression-level=19,force-compression=true" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            .

      - name: Enforce platform and size budgets
        run: |
          root_index="$(tar -xOf "$RUNNER_TEMP/hoocloak.oci.tar" index.json)"
          image_index_digest="$(jq -r '.manifests[0].digest' <<<"$root_index")"
          image_index="$(tar -xOf "$RUNNER_TEMP/hoocloak.oci.tar" "blobs/sha256/${image_index_digest#sha256:}")"
          mapfile -t platforms < <(
            jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)"' <<<"$image_index" |
              sort
          )
          expected=(linux/amd64 linux/arm64)
          test "${platforms[*]}" = "${expected[*]}"
          while read -r platform digest; do
            manifest="$(tar -xOf "$RUNNER_TEMP/hoocloak.oci.tar" "blobs/sha256/${digest#sha256:}")"
            jq -e 'all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+zstd")' <<<"$manifest"
            size="$(jq '[.layers[].size] | add' <<<"$manifest")"
            echo "$platform: $size compressed bytes"
            test "$size" -le "$MAX_COMPRESSED_SIZE"
          done < <(
            jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' <<<"$image_index"
          )

      - name: Build example images
        run: |
          docker buildx build \
            --cache-from type=gha,scope=hoocloak-api \
            --cache-to type=gha,mode=max,scope=hoocloak-api \
            --load \
            --tag hoocloak-api:dev \
            examples/aspnet-api
          docker buildx build \
            --cache-from type=gha,scope=hoocloak-spa \
            --cache-to type=gha,mode=max,scope=hoocloak-spa \
            --load \
            --tag hoocloak-spa:dev \
            examples/react-spa

      - name: Install E2E dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Test complete example stack
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@f1b9be32483e3353e38ef3b5703217d2723e735e # v0.2.4
        with:
          version: 0.2.4

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@5446c51a79d115048601d3f42d6a9127b49fb322 # v0.6.3
        with:
          version: 0.6.3
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@0ed50de75e6e8c097c44e6b50a16f6d8817acedf # v0.2.3
        with:
          version: 0.2.3
          paths: |
            cmd
            internal
            ui
            tests
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@4a833fd00dafc8fb017d5cabec0c38dddba4bc70 # v0.1.1
        with:
          version: 0.1.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
